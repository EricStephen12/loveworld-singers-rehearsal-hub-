<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Song Library - Your personal music collection"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Song Library</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script>
      // Suppress ResizeObserver errors in development
      window.addEventListener('error', function(e) {
        if (e.message === 'ResizeObserver loop completed with undelivered notifications.' ||
            e.message === 'ResizeObserver loop limit exceeded') {
          e.stopImmediatePropagation();
          e.preventDefault();
          return false;
        }
      });

      // Suppress unhandled promise rejections related to ResizeObserver
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message &&
            e.reason.message.includes('ResizeObserver')) {
          e.preventDefault();
          return false;
        }
      });
    </script>
  </body>
</html>
